[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraiq"
version = "0.4.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "data*",
    "models*",
    "optimizer*",
    "simulation*",
    "validation*",
    "visualization*",
]
